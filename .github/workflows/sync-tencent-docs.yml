name: Sync Tencent Docs

on:
  workflow_dispatch:
  schedule:
    # 11:00 Asia/Shanghai (UTC+8)
    - cron: "0 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-tencent-docs.mjs"
      - ".github/workflows/sync-tencent-docs.yml"

permissions:
  contents: write

concurrency:
  group: sync-tencent-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Tencent Docs connection
        env:
          TENCENT_DOCS_CLIENT_ID: ${{ secrets.TENCENT_DOCS_CLIENT_ID }}
          TENCENT_DOCS_ACCESS_TOKEN: ${{ secrets.TENCENT_DOCS_ACCESS_TOKEN }}
          TENCENT_DOCS_OPEN_ID: ${{ secrets.TENCENT_DOCS_OPEN_ID }}
        run: node scripts/sync-tencent-docs.mjs

      - name: Publish sync status
        run: |
          if git diff --quiet -- data/tencent-docs.json; then
            echo "No sync status changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tencent-docs.json
          git commit -m "chore: update Tencent Docs sync status"
          git push
